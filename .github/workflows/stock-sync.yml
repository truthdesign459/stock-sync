name: Stock sync

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 0:00 JST, every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (report only, change nothing)"
        type: boolean
        default: true

concurrency: stock-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Sync sold-out items
        run: python3 sync.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SHOPIFY_STORE: japan-baseball-cards.myshopify.com
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
